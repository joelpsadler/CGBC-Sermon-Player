<header class="top">
 <div class="brand"><div class="logo">CG</div><div><h1>CGBC Knowledge Lab</h1><small>Study • Scripture • Jake • Original language • SPP inspection</small></div></div>
 <div class="top-actions"><button id="reloadBtn" class="btn primary">↻ Load current GitHub</button><button id="fileBtn" class="btn">＋ Open package JSON</button><button id="exportBtn" class="btn">↓ Save evaluation</button></div>
</header>
<div class="sourcebar"><strong>Read-only study</strong><span id="loadStatus">Loading sermon research…</span><details style="margin:0 0 0 auto;padding:4px 7px;max-width:100%;background:#132331"><summary style="font-size:11px">Advanced data source settings</summary><div class="row"><input class="input" id="baseUrl" aria-label="Repository published site URL" title="Base URL for published GitHub Pages repository"><button id="applyBase" class="btn tiny">Use URL</button></div></details><input type="file" accept=".json,.geojson,application/json" id="fileInput" multiple hidden></div>

<div id="entityDrawer" class="drawer-backdrop" aria-hidden="true"><div class="drawer" role="dialog" aria-modal="true" aria-label="Person, place or event details"><div class="drawer-header"><h2 id="drawerTitle">Historical study</h2><button class="btn primary" id="drawerClose" aria-label="Close detail panel">✕ Close</button></div><div class="drawer-content" id="drawerContents"></div></div></div><div id="toast" role="status"></div>
<script>
(()=>{'use strict';
const GITHUB_SITE='https://joelpsadler.github.io/CGBC-Sermon-Player/';
const PATHS={
 sermon:'knowledge/2026/2026-09-27_good-gifts-from-a-good-god.json',
 registry:'knowledge/CGBC_CONCEPT_REGISTRY_v2.json',
 ledger:'knowledge/CGBC_NASB95_VERSE_USAGE_LEDGER.json',
 catalog:'knowledge/CGBC_SCRIPTURE_REFERENCE_CATALOG.json',
 quotes:'config/quote-curation.json',
 geography:'knowledge/shared/people-time-place/CGBC_SOURCE_ATTRIBUTED_MAP_FEATURES.geojson',
 people:'knowledge/shared/people-time-place/CGBC_PEOPLE_TIME_PLACE_LIBRARY.json',
 context:'knowledge/shared/people-time-place/CGBC_HISTORICAL_EVENT_TIME_PLACE_LINKS.json',
 transcript:'data/transcripts/en/2026-09-27_good-gifts-from-a-good-god.json'
};
let data={}, states={}, active='study', searchText='', mapMode='shared', mapInstance=null, mapLayers=null, inspectorKey='sermon', inspectorFilter='', nodeFilter='', passageFilter='', rawPage=0;
const $=id=>document.getElementById(id);
const esc=v=>String(v===undefined||v===null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const js=v=>JSON.stringify(v,null,2); const arr=v=>Array.isArray(v)?v:[]; const obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
const str=v=>v===undefined||v===null?'':typeof v==='object'?JSON.stringify(v):String(v);
const base=()=>($('baseUrl').value.trim()||GITHUB_SITE).replace(/\/?$/,'/');
const href=p=>{try{return new URL(p,base()).href}catch{return p}};
const validLink=u=>{try{let x=new URL(u,base());return ['https:','http:'].includes(x.protocol)?x.href:''}catch{return ''}};
const link=(url,title='Open source')=>{let u=validLink(url);return u?`<a target="_blank" rel="noopener noreferrer" href="${esc(u)}">${esc(title)} ↗</a>`:'<span class="quiet">No verified link</span>'};
const pill=(s,kind='')=>`<span class="pill ${kind}">${esc(s)}</span>`;
const status=s=>{let x=String(s||'').toUpperCase();return /PENDING|QUALIF|CONDIT|INFER|LINK_ONLY|UNREVIEW|NOT_VERIFIED|NOT_AVAILABLE|OMITTED|UNCERTAIN/.test(x)?'warn':/MISSING|BLOCK|FAILED|DISPUTED|NO_|INCOMPATIBLE|NONE/.test(x)?'bad':/READY|VERIFY|VALID|COMPLETE|PRESENT|SUPPORTED|ACTIVE|APPROVED|RESOLVED|PASSED/.test(x)?'good':'info'};
const fmtTime=s=>{if(typeof s!=='number'||!Number.isFinite(s))return 'time not available';let n=Math.floor(s);return [Math.floor(n/3600),Math.floor(n%3600/60),n%60].map((v,i)=>String(v).padStart(i===0?1:2,'0')).join(':')};
const playerAt=seconds=>{const s=data.sermon?.sermon||{},id=s.stableId;return id?href(`index.html?mode=video&item=${encodeURIComponent(id)}&start=${Math.max(0,Math.floor(seconds||0))}&autoplay=0`):''};
const watchAt=seconds=>{const s=data.sermon?.sermon||{},id=s.youtubeId;return id?`https://www.youtube.com/watch?v=${encodeURIComponent(id)}&t=${Math.max(0,Math.floor(seconds||0))}s`:validLink(s.videoUrl)};
const timeLinks=(seconds,withVideo=true)=>typeof seconds==='number'?`<span class="row">${pill(fmtTime(seconds),'info')} ${link(playerAt(seconds),'CGBC player')} ${withVideo?link(watchAt(seconds),'YouTube'):''}</span>`:pill('No timed anchor','warn');
const isScripture=s=>/^(?:(?:[1-3]\s)?[A-Za-z]+(?:\s+[A-Za-z]+){0,2})\s+\d{1,3}:\d{1,3}(?:\s*[-–]\s*\d{1,3})?(?:\s*[-–]\s*\d{1,3}:\d{1,3})?$/i.test(String(s||'').trim());

function workBody(w){return Object.entries(obj(w.content)).map(([k,v])=>`<div class="study-smallhead">${esc(k.replaceAll('_',' '))}</div>${Array.isArray(v)?list(v,x=>`<li>${esc(str(x))}</li>`):showText(v)}`).join('')}
function studyToolContent(r,tool){let o=getData('sermon'),en=obj(o.presentationEnrichment), nodes=arr(o.nodes).filter(n=>arr(r.nodeRefs).includes(n.id)), ind=obj(r.independentStudy),j=obj(r.jake),entry=arr(en.theologyDictionary?.terms),related=arr(r.relatedStudy),sNums=new Set(nodes.flatMap(n=>arr(n.slideNumbers).map(Number))), slides=arr(o.slideMap).filter(s=>sNums.has(Number(s.slideNumber))||arr(s.nodeRefs).some(id=>arr(r.nodeRefs).includes(id))), words=arr(ind.keyWords);
if(tool==='scripture')return `${scriptureReader(r.reference)}<div class="hist-panel"><div class="k-label">Who is involved? Tap for people, origins and chronological evidence</div><div class="chiprow">${arr(AUDIENCE_LENSES[r.reference]?.participants).map(name=>`<button class="person-action" data-open-person="${esc(name)}">♙ ${esc(name)} ⓘ</button>`).join('')}</div><p class="small">${esc(ERA_NOTES[r.reference]||'')}</p><button class="btn tiny" data-study-passage="${studyAnchor(r.reference)}" data-study-tool="impact">How it affected the people, including the inverse →</button></div>
<div class="grid2" style="margin-top:14px">${card('Jake’s teaching in this Scripture',`<p class="study-copy">${esc(j.controllingInterpretation||j.faithfulSynthesis?.text||'No summarized teaching attached.')}</p>${arr(j.spokenEvidence).map(s=>`<div class="note"><b>Recorded exact words</b><p>${esc(s.exactWords||'')}</p>${timeLinks(s.start)}</div>`).join('')}`)}${card('How the original passage is being studied',`<p class="study-copy">${esc(ind.provisionalInterpretation||'No independent interpretation recorded.')}</p><p class="small">Context: ${esc(r.contextReference||ind.literaryContext||'')}</p>${studyBtn('words',r.reference)}`)}</div>`;
if(tool==='jake')return `${card('What Jake taught',`<p class="study-copy">${esc(j.controllingInterpretation||j.faithfulSynthesis?.text||'No synthesis.')}</p>${pill(j.treatment||'sermon treatment','info')}${pill('Synthesis, not verbatim', 'info')}`)}
${arr(j.spokenEvidence).map(x=>card('Exact speech with original timing',`<blockquote class="study-copy">“${esc(x.exactWords||'')}”</blockquote>${timeLinks(x.start)}<div class="sourcecaption">Original transcript cue / segment ${esc(x.segmentIndex??'not given')} • ${esc(x.verificationStatus||'')}</div>`)).join('')}
${nodes.map(n=>`<div class="chapter"><button class="btn primary" data-study-jump="${esc(n.id)}">${esc(fmtTime(n.start))}<br><span style="font-size:11px">Watch / inspect</span></button><div class="chapter-content"><h4>${esc(n.title)}</h4><p>${esc(n.summary||'')}</p><div>${refs(n.doctrine)}${refs(n.topics)}${refs(n.scripture)}</div>${n.spokenExact?`<blockquote>“${esc(n.spokenExact)}”</blockquote>`:''}<div class="row">${link(playerAt(n.start),'CGBC player')}${link(watchAt(n.start),'YouTube clip')}</div></div></div>`).join('')}${nodes.length?'':tinyEmpty('No linked teaching nodes')}`;
if(tool==='people')return passageEntities(r)+card('Timeline and people’s experience',renderHistoricalDates(r.reference)+studyBtn('impact',r.reference));
if(tool==='time')return historicalPerspective(r);
if(tool==='impact')return passageImpact(r);
if(tool==='words')return `${card('Original-language word study for '+r.reference,words.length?words.map(originalWord).join(''):tinyEmpty('No individual Greek or Hebrew form is stored in this passage’s original-language record. The full independent passage study still appears below.'))}${card('What the analysis concluded',`<p class="study-copy">${esc(ind.provisionalInterpretation||'')}</p><p class="small">${esc(ind.evidenceSupport||'')} • ${esc(ind.literaryContext||'')}</p>${ind.textualIssues?.length?list(ind.textualIssues):''}`)}
${card('More original-language source links',arr(en.lexiconLinks).filter(x=>x.reference===r.reference).map(l=>`<p>${link(l.sourceUrl,'Open the original Greek / Hebrew source')} ${pill(l.displayStatus||'research record','info')}</p>`).join('')||'No additional lexical link in this record.')}`;
if(tool==='context')return `${historicalPerspective(r)}${passageImpact(r)}${card('Passage context',`<h4>Read in its surrounding argument</h4><p>${esc(r.contextReference||ind.literaryContext||'')}</p><p class="study-copy">${esc(ind.provisionalInterpretation||'')}</p>${ind.textualIssues?.length?`<b>Textual issues</b>${list(ind.textualIssues)}`:''}`)}
${arr(en.settingTheStage).filter(x=>arr(x.nodeRefs).some(i=>arr(r.nodeRefs).includes(i))||arr(x.scripture).some(a=>a===r.reference)).map(h=>card(h.title,`<p>${esc(h.summary||'')}</p>${pill(h.precision||'Historical precision','info')}${refs(h.evidenceRefs)}`)).join('')}
${arr(en.timelines).map(t=>card(t.title||'Historical illustration',`<div class="tool-grid">${arr(t.events).map(ev=>`<div class="tool-tile"><b>${esc(ev.approxLocalClock||ev.relativeHour)}</b><p>${esc(ev.description||'')}</p></div>`).join('')}</div><p class="sourcecaption">${esc(t.note||'')}</p>`)).join('')}
${card('Place and map evidence',`<p>${esc(en.geography?.reason||'No sermon-specific place inference recorded.')}</p>${refs(r.mapFeatureRefs)}<button class="btn" data-tab="maps">Open interactive biblical map</button>`)}`;
if(tool==='doctrine')return `${card('Doctrinal tags connected to Jake’s teaching',`${refs(nodes.flatMap(n=>arr(n.doctrine)))}${refs(nodes.flatMap(n=>arr(n.topics)))}`)}
${card('Theological & historical dictionary: definitions, not just tags',entry.filter(x=>arr(x.scripture).includes(r.reference)||nodes.some(n=>arr(n.doctrine).includes(x.category))).map(t=>`<div class="word-card"><h4>${esc(t.term)} ${pill(t.category||'')}</h4><p class="study-copy">${esc(t.definition||'')}</p>${refs(t.aliases)}${refs(t.scripture)}</div>`).join('')||`<p>Definitions exist in the full sermon dictionary. <button class="btn" data-tab="doctrine">Open all ${entry.length} definitions</button></p>`)}
${card('All recorded doctrine definitions',`<button class="btn" data-tab="doctrine">Read complete doctrine/dictionary harvest</button>`)}`;
if(tool==='commentary')return `${arr(r.commentaryWitnesses).map(x=>card(x.author||x.work||'Commentary',`<p><b>${esc(x.work||'')}</b></p><p class="study-copy">${esc(x.qualification||'')}</p><p><b>Comparison to Jake:</b> ${esc(x.relationToJake||'Not specified')}</p><p>${link((x.itemLocator||'').split(' ')[0],'Read full cited source')}</p>${pill(x.reuseClass||'Source rights not labeled',status(x.reuseClass))}`)).join('')||tinyEmpty('No source-specific commentary witness is recorded for this passage.')}
${card('Independent Scripture interpretation, before commentary comparison',`<p class="study-copy">${esc(ind.provisionalInterpretation||'')}</p>`)}`;
if(tool==='slides')return `${card('Original slides related to this passage',`${pill(slides.length+' connected slides','info')}<div class="grid3">${slides.map(actualSlide).join('')}</div>${slides.length?'':'No directly connected slides identified for this passage.'}`)}${card('Source-to-timestamp evidence',nodes.map(n=>`<p><b>${esc(n.title||n.id)}</b> ${timeLinks(n.start)} • Cues ${esc(arr(n.cueNumbers).length)} • Slides ${esc(arr(n.slideNumbers).join(', ')||'none')}</p>`).join(''))}`;
if(tool==='related')return `${card('Explore the connected passage studies',related.map(q=>`<div class="tool-tile"><h4>${esc(q.question||'Related Study')}</h4><p>${esc(q.fallbackSummary||'')}</p>${q.destination?.type==='scripture'?studyBtn('scripture',q.destination.reference):q.destination?.type==='node'?`<button class="btn" data-study-jump="${esc(q.destination.stableId||'')}">Open linked teaching</button>`:''}</div>`).join('')||'No related study destinations')}
${card('Teaching connections',nodes.flatMap(n=>arr(n.connections).map(c=>`<p>${pill(c.type||'link')}${esc(n.title||n.id)} → ${esc(c.targetNodeRef||c.target||'')} <button class="btn tiny" data-study-jump="${esc(c.targetNodeRef||'')}">Show linked node</button></p>`)).join('')||'No typed links for these nodes')}`;
if(tool==='author')return `${arr(o.authorCorpus?.commissionedWorks).map(w=>card(w.topic||w.provenance||'Commissioned work',`${pill(w.provenance||'COMMISSIONED','info')}${workBody(w)}<div class="sourcecaption">${esc(w.notes||'')}</div>${refs(w.evidenceRefs)}`)).join('')||tinyEmpty('No commissioned draft content found')}${card('Past teaching and the commissioned record remain distinct',`<p>Jake’s earlier speech is represented above with original evidence. The commissioned material is original CGBC output, not claimed as speech in this historical recording.</p><button class="btn" data-tab="author">Open full Author Corpus</button>`)}`;
if(tool==='evidence')return `${card('Source-evidence references',`${refs(r.sourceEvidenceRefs)}${refs(ind.sourceEvidenceRefs)}${refs(r.contextClaimRefs)}${refs(r.entityRefs)}${refs(r.eventRefs)}${refs(r.mapFeatureRefs)}`)}
${arr(r.reviewGates).map(x=>`<div class="card"><b>${esc(x.issue||'Review gate')}</b><p>${esc(x.action||'')}</p>${pill(x.status||'','info')}</div>`).join('')}
${card('Original sources / source rights',arr(o.sources).map(x=>`<div class="kv"><dt>${esc(x.id||x.kind)}</dt><dd>${esc(x.pathOrName||'')} • ${esc(x.rightsUse||'')}</dd></div>`).join(''))}
${raw(r,'Optional full underlying record')}`;
return '<p>Select a study tool above.</p>';}
function renderStudy(){let o=getData('sermon'),records=arr(o.passageResearch?.records),reg=getData('registry'),en=obj(o.presentationEnrichment);if(!records.length)return header('Interactive study','Loading the full canonical Good Gifts Info Map from the published repository…')+sourceReport();
currentStudyIndex=Math.max(0,Math.min(records.length-1,currentStudyIndex));let r=records[currentStudyIndex],ledger=getData('ledger'),q=arr(o.discover).filter(x=>arr(x.scripture).includes(r.reference));
return header('Good Gifts: interactive study','Choose a passage, then tap a study tool. Every button opens readable content from the package; original JSON is optional evidence, not the main experience.',pill('REAL CANONICAL DATA','good'))+
`<div class="studyhero"><article class="card"><div class="study-smallhead">${esc(o.sermon?.title||'Good Gifts from a Good God')} · ${esc(o.sermon?.date||'')}</div><h3 style="font-size:26px;margin:7px 0">${esc(r.reference)}</h3><p class="study-copy">${esc(r.jake?.controllingInterpretation||r.jake?.faithfulSynthesis?.text||'')}</p><div class="row">${link(playerAt(r.jake?.spokenEvidence?.[0]?.start||0),'▶ Open sermon at this passage')}${link(watchAt(r.jake?.spokenEvidence?.[0]?.start||0),'Watch on YouTube')}</div></article>
<article class="card"><h3>What the package contains</h3><div class="row">${pill(records.length+' passage studies','good')}${pill(arr(o.nodes).length+' teaching nodes','good')}${pill(arr(en.theologyDictionary?.terms).length+' definitions','good')}${pill(arr(reg.concepts).length+' normalized concepts','info')}${pill(arr(o.authorCorpus?.commissionedWorks).length+' commissioned writings','info')}</div><div style="margin-top:12px">${pill(`NASB95 ledger: ${ledger.chargedVerseUnits??'?'} / ${ledger.allowedVerseUnits??1000}`,'info')}</div><p class="small">Allocated Scripture opens with the full original NASB95 slide images. Optional KJV comparison remains available.</p><button class="btn tiny" data-tab="audit">See complete harvest evaluation</button></article></div>
<div class="study-subnav"><h3>1. Pick a Scripture passage</h3><div class="passage-buttons">${records.map((x,i)=>`<button aria-pressed="${i===currentStudyIndex}" class="${i===currentStudyIndex?'picked':''}" data-study-passage="${i}">${esc(x.reference)}</button>`).join('')}</div><h3>2. Open the tools for ${esc(r.reference)}</h3><div class="tool-buttons" role="tablist">${studyTools.map(([code,name])=>`<button role="tab" aria-selected="${code===currentStudyTool}" class="${code===currentStudyTool?'picked':''}" data-study-tool="${code}">${name}</button>`).join('')}</div></div>
<div class="tool-view" id="toolArea">${studyToolContent(r,currentStudyTool)}</div><div class="interactive-note">Tap any <b>person name</b> or <b>Scripture reference</b> to open linked study. Greek / Hebrew, Strong’s, doctrine, people, dates, historical audience effects and inverse questions stay available for every selected passage.</div>
${card('More to explore: Discover questions tied to this passage',`${q.map(d=>`<div class="tool-tile"><b>${esc(d.question)}</b><p>${esc(d.answer||'')}</p><p>${timeLinks(d.start)}</p></div>`).join('')||'Open Discover for the complete question set.'}<p><button class="btn" data-tab="discover">All Discover questions</button> <button class="btn" data-tab="maps">Working map demonstration</button> <button class="btn" data-tab="data">Full raw package (optional)</button></p>`)}`;
}
const scriptureOrigin='https://bible-api.com/';
function readBibleFromRecord(ref){let o=getData('sermon');let rec=arr(o.passageResearch?.records).find(x=>x.reference===ref);if(!rec)return null;
for(const x of [rec.verseText,rec.scriptureText,rec.text,rec.passageText,rec.independentStudy?.verseText]){if(typeof x==='string'&&x.length>35)return {text:x,label:'Embedded canonical source text'};}
return null;}
function sanitizeVerseResponse(json,ref){if(!json||!Array.isArray(json.verses)||!json.verses.length)throw new Error('Provider did not return verses for '+ref);return {verses:json.verses.map(v=>({n:v.verse,chapter:v.chapter,book:v.book_name,text:String(v.text||'').trim()})),label:json.translation_name||'KJV',reference:json.reference||ref};}
async function fillVersePanels(){let panels=Array.from(document.querySelectorAll('[data-scripture-ref]'));for(const el of panels){const ref=el.dataset.scriptureRef;if(!ref)continue;const own=readBibleFromRecord(ref);if(own){el.innerHTML=`<p>${esc(own.text)}</p><div class="readmeta">${esc(own.label)}</div>`;continue}
const paint=(res)=>{if(!document.contains(el))return;let text=arr(res.verses).map(v=>`<p class="verse"><span class="verseno">${esc(v.n)}</span> ${esc(v.text)}</p>`).join('');el.innerHTML=text+`<div class="readmeta">${esc(res.label||'King James Version')} • ${esc(res.reference||ref)} • fetched as live Bible text</div>`};
if(verseCache[ref]){paint(verseCache[ref]);continue}
try{let url=scriptureOrigin+encodeURIComponent(ref)+'?translation=kjv';if(!fetches[ref])fetches[ref]=fetch(url).then(resp=>{if(!resp.ok)throw new Error('HTTP '+resp.status);return resp.json()}).then(json=>sanitizeVerseResponse(json,ref));let result=await fetches[ref];verseCache[ref]=result;paint(result)}catch(error){if(document.contains(el))el.innerHTML=`<div class="study-error"><b>Live verse service unavailable.</b> ${esc(error.message||error)}<p>${link('https://www.biblegateway.com/passage/?search='+encodeURIComponent(ref)+'&version=KJV','Open full KJV passage')} · ${link('https://www.biblegateway.com/passage/?search='+encodeURIComponent(ref)+'&version=NASB1995','Open NASB95')}</p></div>`;delete fetches[ref];}}
}

function render(){nav();let node=$('main');try{node.innerHTML=({study:renderStudy,overview:renderOverview,audit:renderAudit,jake:renderJake,bible:renderBible,quick:renderQuick,doctrine:renderDoctrine,discover:renderDiscover,deep:renderDeep,maps:renderMaps,slides:renderSlides,quotes:renderQuotes,author:renderAuthor,sources:renderSources,search:renderSearch,data:renderData}[active]||renderOverview)()+`<div class="foot">CGBC Knowledge Lab • Read-only viewer • canonical Info Map 3.0 is the authority; other records remain separate for their established purposes. No GitHub edits, approvals, deployment actions, or SPP reprocessing occur in this page.</div>`;
setTimeout(enhanceNameLinks,5);if(active==='maps')setTimeout(initMap,20);
if(active==='study'||active==='bible')setTimeout(fillVersePanels,40);
if(active==='data')window.scrollTo({top:0,behavior:'instant'});}catch(err){console.error(err);node.innerHTML=header('Viewer error','A panel could not render, but its original data is still available through the raw data explorer.')+`<pre>${esc(err.message||String(err))}</pre>`+`<button class="btn" data-tab="data">Open all records</button>`}}
async function load(){let root=base();$('loadStatus').textContent='Loading read-only datasets…';for(const k of Object.keys(PATHS))states[k]={state:'LOADING'};render();let success=0;
await Promise.all(Object.entries(PATHS).map(async([key,path])=>{try{const response=await fetch(href(path),{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const value=await response.json();data[key]=value;states[key]={state:'LOADED',detail:Array.isArray(value)?value.length+' rows':''};success++}catch(e){states[key]={state:'UNAVAILABLE',detail:e.message};}}));$('loadStatus').textContent=`${success}/${Object.keys(PATHS).length} sources loaded · ${root.includes('github.io')?'Published repository':'custom/local source'}`;render();}
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){active=b.dataset.tab;render();window.scrollTo(0,0)}});
$('main').addEventListener('click',async e=>{let b=e.target.closest('button,[data-map-id]');if(!b)return;
if(b.dataset.tab){active=b.dataset.tab;render();window.scrollTo(0,0);return}
if(b.dataset.openPerson){openEntity(b.dataset.openPerson,'person');return}
if(b.dataset.openReference){openReference(b.dataset.openReference);return}
if(b.dataset.openEntity){openEntity(b.dataset.openEntity,'evidence');return}
if(b.dataset.nasbRef){
 const ref=b.dataset.nasbRef, slides=availableNASBSlides(ref);
 if(b.dataset.nasbSlide!==undefined)nasbReaderPosition[ref]=Number(b.dataset.nasbSlide)||0;
 else if(b.dataset.nasbStep!==undefined)nasbReaderPosition[ref]=Math.min(Math.max((nasbReaderPosition[ref]||0)+Number(b.dataset.nasbStep),0),Math.max(slides.length-1,0));
 else if(b.dataset.nasbAll!==undefined)nasbShowAll[ref]=!nasbShowAll[ref];
 render();return;
}
if(b.dataset.kjvRef){const ref=b.dataset.kjvRef;kjvOptIn[ref]=!kjvOptIn[ref];render();return}
if(b.dataset.studyPassage!==undefined){currentStudyIndex=Number(b.dataset.studyPassage);if(b.dataset.studyTool)currentStudyTool=b.dataset.studyTool;active='study';render();document.getElementById('toolArea')?.scrollIntoView({block:'start',behavior:'smooth'});return}
if(b.dataset.studyTool){currentStudyTool=b.dataset.studyTool;active='study';render();document.getElementById('toolArea')?.scrollIntoView({block:'start',behavior:'smooth'});return}
if(b.dataset.studyJump){let n=arr(getData('sermon').nodes).find(x=>x.id===b.dataset.studyJump);if(n){nodeFilter=n.id;active='jake';render();window.scrollTo(0,0)}return}
if(b.dataset.inspector){inspectorKey=b.dataset.inspector;active='data';render();window.scrollTo(0,0);return}
if(b.dataset.nodefilter!==undefined){nodeFilter=b.dataset.nodefilter;render();return}
if(b.dataset.findnode){nodeFilter=b.dataset.findnode;render();window.scrollTo(0,0);return}
if(b.dataset.mapmode){mapMode=b.dataset.mapmode;render();return}
if(b.dataset.mapId){showMapDetails(b.dataset.mapId);return}
if(b.dataset.path){let v=getData(inspectorKey)[b.dataset.path];$('treeFocus').innerHTML=`<h4>${esc(b.dataset.path)}</h4>${raw(v,'All '+b.dataset.path+' nested values').replace('<details','<details open')}`;return}
if(b.id==='nodeFilterBtn'){nodeFilter=$('nodeFilter').value;render();return}
if(b.id==='passageFilterBtn'){passageFilter=$('passageFilter').value;render();return}
if(b.id==='inspectorSearchBtn'){inspectorFilter=$('inspectorFilter').value;render();return}
if(b.id==='clearSearchBtn'){inspectorFilter='';render();return}
if(b.id==='recordSearchBtn'){inspectorFilter=$('recordSearch').value;inspectorKey='sermon';active='data';render();return}
if(b.id==='downloadSelected'){download('CGBC_'+inspectorKey+'_inspection.json',js(getData(inspectorKey)));return}
if(b.classList.contains('copy-record')){let p=b.closest('details').querySelector('pre');if(p){try{await navigator.clipboard.writeText(p.textContent);toast('Record copied')}catch{toast('Copy not available: select raw text below')}}return}
});
$('main').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='inspectorFilter'){$('inspectorSearchBtn')?.click()}if(e.key==='Enter'&&e.target.id==='nodeFilter'){$('nodeFilterBtn')?.click()}if(e.key==='Enter'&&e.target.id==='passageFilter'){$('passageFilterBtn')?.click()}});
$('drawerClose').onclick=closeEntity;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEntity()});$('entityDrawer').addEventListener('click',e=>{if(e.target===$('entityDrawer'))closeEntity();const b=e.target.closest('button');if(!b)return;if(b.dataset.openPerson){openEntity(b.dataset.openPerson,'person')}if(b.dataset.openEntity){openEntity(b.dataset.openEntity,'evidence')}if(b.dataset.openReference){closeEntity();openReference(b.dataset.openReference)}if(b.dataset.studyPassage!==undefined){closeEntity();currentStudyIndex=Number(b.dataset.studyPassage);currentStudyTool=b.dataset.studyTool||'scripture';active='study';render()}});$('reloadBtn').onclick=load;$('applyBase').onclick=load;$('fileBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=async e=>{let fs=Array.from(e.target.files||[]),loaded=0;for(let f of fs){try{let v=JSON.parse(await f.text()),n=f.name.toLowerCase();let k=n.includes('concept_registry')?'registry':n.includes('verse_usage_ledger')?'ledger':n.includes('scripture_reference_catalog')?'catalog':n.includes('quote-curation')?'quotes':n.endsWith('.geojson')||v.type==='FeatureCollection'?'geography':n.includes('people_time_place_library')?'people':n.includes('historical_event_time')?'context':v.recordType==='CGBC_SERMON_KNOWLEDGE'||v.schemaVersion==='3.0'?'sermon':n.includes('transcript')?'transcript':null;if(!k){toast('Unrecognized JSON: '+f.name);continue}data[k]=v;states[k]={state:'LOCAL FILE',detail:f.name};loaded++}catch(err){console.error(err);toast('Failed to read '+f.name)}}$('loadStatus').textContent=`${loaded} local file(s) opened for inspection`;render();};
$('exportBtn').onclick=()=>{let m=readouts(),o=getData('sermon');let payload={inspectedAt:new Date().toISOString(),ui:'knowledge-lab-spp2-deep-study-v3.html',sermonStableId:o.sermon?.stableId||null,canonicalPath:PATHS.sermon,liveStates:states,counts:m,featureDisposition:o.presentationEnrichment?.featureDisposition||{},editorialFlags:o.editorialFlags||[],note:'Surface-level presentation audit, not an independent original-evidence/schema/rights certification.'};download('CGBC-SPP-Good-Gifts-visual-audit.json',js(payload));};
$('baseUrl').value=(location.protocol==='file:' || location.protocol==='about:' || !location.host)?GITHUB_SITE:new URL('./',location.href).href;
const params=new URLSearchParams(location.search);if(params.get('base'))$('baseUrl').value=params.get('base');load();
})();
